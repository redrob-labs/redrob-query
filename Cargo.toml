[workspace]
members = ["crates/redrob-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
authors = ["Janghoon Lee (Redrob) and contributors"]
repository = "https://github.com/redrob-labs/redrob-query"
homepage = "https://github.com/redrob-labs/redrob-query"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
