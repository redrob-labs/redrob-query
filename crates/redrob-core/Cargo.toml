[package]
name = "redrob-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Secure Rust core for Redrob Query database connectivity, metadata, querying, and AI transport"
readme = "../../README.md"
publish = false

[dependencies]
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fs2 = "0.4"
base64 = "0.23"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
mongodb = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite", "chrono", "bigdecimal", "uuid", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
