[package]
name = "redrob-query"
description = "Redrob Query: an agentic database client for PostgreSQL, MySQL, SQLite and MongoDB"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "redrob-query"
path = "src/main.rs"

[dependencies]
redrob-query-core = { path = "../../crates/redrob-query-core" }
eframe = { workspace = true, features = ["wgpu", "accesskit", "wayland", "x11", "persistence", "default_fonts"] }
egui = { workspace = true }
egui_extras = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The system language on first run (Windows has no LANG); the same pin as redrob-canvas.
sys-locale = "=0.3.2"
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { workspace = true }
rfd = { workspace = true }
webbrowser = { workspace = true }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
