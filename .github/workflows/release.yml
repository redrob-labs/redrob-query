name: Signed desktop release

# The redrob-labs release shape (redrob-labs/.github workflow-templates/release.yml):
#
#   tag v<version> on main  ->  version  ->  build matrix (build, then sign)  ->  updater manifest  ->  publish
#
# The parts every repository shares are not in this file; they are called:
#   - redrob-labs/.github/actions/sign-windows/sign.ps1          Authenticode through Azure Artifact Signing,
#                                                                 run by tauri as `bundle.windows.signCommand`
#   - redrob-labs/.github/.github/workflows/release-publish.yml   checksums, launcher manifest, the release
#
# Rules the shape encodes:
#   - the trigger is the tag push; `workflow_dispatch` with a version is a DRY RUN -- it builds, signs and
#     verifies every leg and publishes nothing;
#   - Windows: compile, THEN `azure/login` (OIDC), THEN bundle -- tauri signs the executable and both
#     installers during bundling, through the shared script. The login token is short-lived and the compile
#     is long; never the other way round, never a client secret or a certificate file;
#   - the jobs that sign run in the `release` environment with `id-token: write`;
#   - the publish job runs only on a tag and only when every build job succeeded, and publishes the
#     release as latest (as a prerelease when the version carries a `-`).
#
# Everything a leg uploads is a `release-*` artifact under its FINAL name; the publish job ships those
# bytes unchanged. latest.json, the Tauri updater feed, is one of them (the updater-manifest job).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run, e.g. 0.3.0-1 (builds and signs every leg, publishes nothing)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT: Redrob Query
  PRODUCT_URL: https://github.com/${{ github.repository }}

jobs:
  version:
    name: Resolve the version and verify the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
      # The build matrix and the updater platform keys the manifest must carry, both derived from
      # the single list in scripts/release-matrix.mjs.
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      platforms: ${{ steps.release-matrix.outputs.platforms }}
      asset_suffixes: ${{ steps.release-matrix.outputs.asset_suffixes }}
      windows_signing_ready: ${{ steps.release-matrix.outputs.windows_signing_ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag names the version the sources declare, or it is refused: the installers, the updater
      # payloads and latest.json all carry package.json's version, and a tag that disagrees would
      # publish v0.3.0 whose every file says 0.2.4. A dispatch names any well-formed version for the
      # dry run, and scripts/prepare-release-config.mjs stamps it onto the build.
      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            if [ "$v" != "$declared" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the package.json version ${declared}"
              exit 1
            fi
          elif [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
          else
            echo "::error::not a tag push and no version input"
            exit 1
          fi
          # tauri's MSI bundler maps a pre-release identifier onto the fourth Windows version
          # field, so it must be a plain number no greater than 65535 (`0.3.0-1`, not `0.3.0-rc.1`);
          # the bundler would refuse `rc.1` two jobs and forty minutes later.
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]{0,4}))?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-1 (a pre-release identifier must be numeric for the MSI bundler)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          {
            echo "### ${PRODUCT} v$v (\`${GITHUB_SHA::9}\`)"
            [ "${GITHUB_REF_TYPE:-}" = tag ] || echo "Dry run: nothing is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require release tag commit on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev
          patchelf libssl-dev
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Decides which platforms this release builds. Windows is omitted, with a notice in the
      # run log, until the repository variable WINDOWS_SIGNING_READY is "true" -- see the
      # script for why an unsigned Windows installer is not the fallback.
      - name: Resolve the release matrix
        id: release-matrix
        env:
          WINDOWS_SIGNING_READY: ${{ vars.WINDOWS_SIGNING_READY }}
        run: node scripts/release-matrix.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete verification
        run: npm run check

  rust-advisories:
    name: Rust security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust for security audit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      # This repository's Cargo workspace is at the root, not under src-tauri.
      - name: Audit locked Rust dependencies
        run: cargo +stable audit --file Cargo.lock

  build:
    name: Build ${{ matrix.label }}
    needs: [version, rust-advisories]
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs/<repo>:environment:release); the macOS and Linux legs run in it too so one
    # set of protection rules covers every leg that produces a release file.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential (Windows leg).
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Generated by scripts/release-matrix.mjs in the version job, so the Windows leg can be
        # excluded while Authenticode signing is not configured, and so the updater platform
        # keys the manifest job requires come from the same single list.
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The one copy of the Windows signing recipe. tauri runs it as `bundle.windows.signCommand`
      # (scripts/prepare-release-config.mjs points the bundler at it), so this repository carries
      # no signing code of its own.
      - name: Check out the shared signing recipe
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redrob-labs/.github
          ref: main
          path: .redrob-shared

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        # desktop-file-utils: the AppImage repack step below runs appimagetool, which refuses to
        # pack without `desktop-file-validate` on PATH (measured on the v0.2.1 Linux leg).
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev
          patchelf libssl-dev desktop-file-utils

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Require release signing material
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          printf 'APPLE_API_KEY_PATH=%s\n' "$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"

      # Writes src-tauri/tauri.release.conf.json: the updater key and feed, the version this run
      # builds, and on Windows the shared sign.ps1 as the bundler's sign command.
      - name: Prepare signed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          REDROB_SHARED_DIR: ${{ github.workspace }}/.redrob-shared
        run: npm run release:prepare

      # Windows signs mid-bundling, so the login has to sit between the compile and the bundle:
      # compile everything first (no installer yet), log in, then bundle. The second `tauri build`
      # finds cargo's output up to date and goes straight to packaging and signing.
      - name: Compile before signing (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle --config src-tauri/tauri.release.conf.json

      - name: Log in to Azure (OIDC)
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # On Windows, tauri calls the shared sign.ps1 on the executable, the NSIS installer and the
      # MSI as it packages them, with ARTIFACT_SIGNING_* from this environment and the login above.
      # On macOS it signs with the imported Developer ID and notarizes with the API key.
      - name: Build, bundle and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ runner.os == 'Windows' && secrets.ARTIFACT_SIGNING_ENDPOINT || '' }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && secrets.ARTIFACT_SIGNING_ACCOUNT || '' }}
          ARTIFACT_SIGNING_CERT_PROFILE: ${{ runner.os == 'Windows' && secrets.ARTIFACT_SIGNING_CERT_PROFILE || '' }}
          SIGN_DESCRIPTION: ${{ env.PRODUCT }}
          SIGN_URL: ${{ env.PRODUCT_URL }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Locate the bundle directory
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          # This is a Cargo workspace rooted at the repo, so the bundle is NOT under src-tauri/;
          # ask cargo instead of hardcoding either layout.
          target_root="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          echo "dir=${target_root}/${RELEASE_TARGET}/release/bundle" >> "$GITHUB_OUTPUT"

      # The default bundler ships the build host's libwayland in the AppImage, and on Mesa 25+ that
      # makes WebKitWebProcess abort with EGL_BAD_PARAMETER: the window opens and stays blank
      # (tauri-apps/tauri#15665). Measured on v0.2.0 before this step existed -- strace on the web
      # process, then the same AppImage with only those four libraries removed rendered with no
      # environment overrides. Repacking changes the bytes, so the script also re-signs; the manifest
      # job picks the new .sig up from beside the staged file and verifies it against the bytes.
      - name: Repack the AppImage without bundled Wayland, and re-sign it
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLE_DIR: ${{ steps.bundle.outputs.dir }}
          # Pinned by digest: this binary rewrites a signed release artifact.
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" "$APPIMAGETOOL_URL"
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum -c -
          chmod +x "$tool"
          # Runners have no FUSE; both the tool and the AppImage run through their own extractor.
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash scripts/resign-linux-appimage.sh "$BUNDLE_DIR" "$tool"

      # sign.ps1 already verified each file it signed (`signtool verify /pa`, Status Valid, signer
      # CN). This asserts the OUTCOME over the installers that leave the runner: both are present
      # and each carries a Valid, timestamped Authenticode signature by the organisation's
      # certificate -- so a bundler that quietly skipped the sign command cannot ship unsigned.
      - name: Verify Windows installer signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.dir }}
          EXPECTED_CN: McKinley Rice, Inc.
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:BUNDLE_DIR)) { throw "No bundle directory at $env:BUNDLE_DIR" }
          $installers = @(Get-ChildItem -LiteralPath $env:BUNDLE_DIR -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if (-not ($installers.Extension -contains '.exe') -or -not ($installers.Extension -contains '.msi')) {
            throw "Expected both signed NSIS and MSI installers"
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($installer.Name) signature status $($signature.Status): $($signature.StatusMessage)"
            }
            $cn = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($cn -ne $env:EXPECTED_CN) {
              throw "$($installer.Name) signed by CN=$cn, expected CN=$($env:EXPECTED_CN)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$($installer.Name) signature carries no timestamp"
            }
            Write-Host "$($installer.Name) signed by CN=$cn status=$($signature.Status)"
          }

      # Installers and their .sig files take the names Redrob Launcher installs
      # (`redrob-query-<version>-<os>-<arch>.<ext>`); the updater payloads keep the bundler's.
      # Decided here, before upload, so latest.json can name every asset before the release exists.
      - name: Stage the release files under their published names
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.dir }}
        run: node scripts/stage-release-assets.mjs "$BUNDLE_DIR" "$RUNNER_TEMP/release-assets" "$RELEASE_VERSION"

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  # latest.json IS the feed on GitHub Releases. Missing it does not fail an install, it silently
  # freezes every existing client on its current version; a signature over the wrong bytes passes
  # "has a signature" and fails on every user's machine at the first update check. So the manifest
  # is written from the staged files, checked against the platforms the matrix built, and every
  # signature is verified against the file it names -- on a dry run as well as on a tag.
  updater-manifest:
    name: Updater manifest
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download every leg's release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write latest.json and verify every updater signature against its bytes
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          REQUIRED_PLATFORMS: ${{ needs.version.outputs.platforms }}
          REQUIRED_ASSET_SUFFIXES: ${{ needs.version.outputs.asset_suffixes }}
        run: |
          set -euo pipefail
          echo "Staged release files:"
          ls -1 release-assets | sed 's/^/  /'
          mkdir -p manifest
          node scripts/write-updater-manifest.mjs release-assets "$RELEASE_VERSION" "$GITHUB_REPOSITORY" manifest/latest.json
          cat manifest/latest.json
      - name: Upload latest.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-updater-manifest
          path: manifest/latest.json
          if-no-files-found: error

  publish:
    needs: [version, rust-advisories, build, updater-manifest]
    if: always() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      title: Redrob Query
      launcher_manifest: true
      publish: true
