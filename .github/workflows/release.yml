name: Signed desktop release

# Only a tag builds. There used to be a `release: [published]` trigger here for the CDN
# promotion job; with GitHub Releases as the channel itself, publishing the draft IS the
# promotion, so a second workflow run on that event would have nothing to do.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      # The build matrix and the updater platform keys the draft must carry, both derived from
      # the single list in scripts/release-matrix.mjs.
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      platforms: ${{ steps.release-matrix.outputs.platforms }}
      asset_suffixes: ${{ steps.release-matrix.outputs.asset_suffixes }}
      windows_signing_ready: ${{ steps.release-matrix.outputs.windows_signing_ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release tag commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main"
            exit 1
          fi
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev
          patchelf libssl-dev
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Decides which platforms this release builds. Windows is omitted, with a notice in the
      # run log, until the repository variable WINDOWS_SIGNING_READY is "true" -- see the
      # script for why an unsigned Windows installer is not the fallback.
      - name: Resolve the release matrix
        id: release-matrix
        env:
          WINDOWS_SIGNING_READY: ${{ vars.WINDOWS_SIGNING_READY }}
        run: node scripts/release-matrix.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete verification
        run: npm run check

  rust-advisories:
    name: Rust security advisories
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust for security audit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      # This repository's Cargo workspace is at the root, not under src-tauri.
      - name: Audit locked Rust dependencies
        run: cargo +stable audit --file Cargo.lock

  build:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push'
    needs: [validate, rust-advisories]
    permissions:
      contents: write
    environment: production-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Generated by scripts/release-matrix.mjs in the validate job, so the Windows leg can
        # be excluded while Authenticode signing has no certificate, and so the updater
        # platform keys the verify job requires come from the same single list.
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev
          patchelf libssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Require release signing material
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            test -n "${!name:-}"
          done
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          printf 'APPLE_API_KEY_PATH=%s\n' "$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/redrob-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/redrob-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/redrob-build.keychain"
          security import "$RUNNER_TEMP/redrob-certificate.p12" -k "$RUNNER_TEMP/redrob-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/redrob-build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/redrob-build.keychain" | awk -F'"' 'NR==1 {print $2}')"
          test -n "$CERT_ID"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$CERT_ID" >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw "Windows signing secrets are required"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "redrob-certificate.pfx"
          $link = $env:WIN_CSC_LINK.Trim()
          if ($link -match '^https://') {
            try {
              Invoke-WebRequest -Uri $link -OutFile $certificatePath -UseBasicParsing
            } catch {
              throw "Failed to download the Windows signing certificate over HTTPS"
            }
          } else {
            if ($link -match '^data:[^,]*;base64,') {
              $payload = $link.Substring($link.IndexOf(',') + 1)
            } else {
              $payload = $link
            }
            $payload = $payload -replace '\s', ''
            if ($payload -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
              throw "WIN_CSC_LINK must be raw Base64 PFX data, a data:*;base64 URI, or an HTTPS URL"
            }
            try {
              [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($payload))
            } catch {
              throw "WIN_CSC_LINK contains invalid Base64 certificate data"
            }
          }

          $password = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          # Read the EKU out of the X.509 extension itself, not out of PowerShell's
          # EnhancedKeyUsageList. That list's ObjectId is already a STRING, so the
          # `.ObjectId.Value` this used to compare is always $null and the `-contains` never
          # matched -- the filter rejected the organisation's certificate, which does carry
          # Code Signing. The diagnostic printed `eku=Code Signing ()` and "EKU is not Code
          # Signing" in the same breath, which is the shape of a check reading the wrong
          # property rather than a certificate that is wrong.
          function Get-EkuOid([Security.Cryptography.X509Certificates.X509Certificate2]$candidate) {
            $oids = @()
            foreach ($extension in $candidate.Extensions) {
              if ($extension.Oid.Value -ne "2.5.29.37") { continue }
              $eku = $extension -as [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]
              if ($null -eq $eku) { continue }
              foreach ($usage in $eku.EnhancedKeyUsages) {
                $oids += if ($usage.FriendlyName) { "$($usage.FriendlyName) ($($usage.Value))" } else { $usage.Value }
              }
            }
            return $oids
          }
          $certificate = $imported | Where-Object {
            $_.HasPrivateKey -and
            $_.NotBefore.ToUniversalTime() -le [DateTime]::UtcNow -and
            $_.NotAfter.ToUniversalTime() -gt [DateTime]::UtcNow -and
            ((Get-EkuOid $_) -match [regex]::Escape($codeSigningOid))
          } | Sort-Object NotAfter -Descending | Select-Object -First 1
          if (-not $certificate -or -not $certificate.Thumbprint) {
            # One message for four independent conditions is not diagnosable: an expired
            # certificate, a certificate with no private key, and one issued for the wrong
            # purpose all read the same. Report what each imported certificate actually is
            # so the operator knows whether to renew it or replace it. Only public metadata
            # is printed -- never the key, the password, or the PFX bytes.
            Write-Host "Imported $($imported.Count) certificate(s); none usable for code signing:"
            foreach ($candidate in $imported) {
              $ekus = @(Get-EkuOid $candidate)
              $reasons = @()
              if (-not $candidate.HasPrivateKey) { $reasons += "no private key" }
              if ($candidate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow) { $reasons += "not valid until $($candidate.NotBefore.ToUniversalTime().ToString('u'))" }
              if ($candidate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) { $reasons += "EXPIRED $($candidate.NotAfter.ToUniversalTime().ToString('u'))" }
              if ($ekus.Count -eq 0) { $reasons += "no Enhanced Key Usage at all" }
              elseif ($ekus -notmatch [regex]::Escape($codeSigningOid)) { $reasons += "EKU is not Code Signing" }
              Write-Host "  subject=$($candidate.Subject)"
              Write-Host "    validity=$($candidate.NotBefore.ToUniversalTime().ToString('u')) .. $($candidate.NotAfter.ToUniversalTime().ToString('u'))"
              Write-Host "    hasPrivateKey=$($candidate.HasPrivateKey)  eku=$(if ($ekus.Count) { $ekus -join ', ' } else { '(none)' })"
              Write-Host "    unusable because: $($reasons -join '; ')"
            }
            throw "WIN_CSC_LINK holds no certificate usable for Authenticode signing. See the per-certificate reasons above; the secret needs a PFX with a private key, an unexpired validity window, and the Code Signing EKU ($codeSigningOid)."
          }
          # The organisation's code-signing certificate is SELF-SIGNED. Measured, not assumed:
          # the chain terminates in "a root certificate which is not trusted by the trust
          # provider", and a sibling product that signs with this same secret says so in its
          # own workflow and accepts NotTrusted there.
          #
          # So an untrusted or incomplete root is expected and is NOT a defect to fail on.
          # Everything else still is -- a revoked certificate, one outside its validity window,
          # a broken signature, a bad usage. Those are listed explicitly rather than the check
          # being deleted, because deleting it would also stop catching a revoked certificate.
          #
          # WHAT THIS BUYS AND WHAT IT DOES NOT. It buys tamper-evidence and a stable publisher
          # identity: the installer cannot be modified without breaking the signature. It does
          # NOT buy trust -- Windows SmartScreen still warns the user that the publisher is
          # unknown, exactly as it would for an unsigned installer. Removing that warning needs
          # an OV or EV certificate from a CA whose root ships in Windows; no change to this
          # workflow can substitute for one.
          $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
          $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
          $chain.ChainPolicy.RevocationFlag = [Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
          $built = $chain.Build($certificate)
          $tolerated = @("UntrustedRoot", "PartialChain", "RevocationStatusUnknown", "OfflineRevocation")
          $fatal = @($chain.ChainStatus | Where-Object { $tolerated -notcontains $_.Status.ToString() })
          if ($fatal.Count -gt 0) {
            $chainErrors = ($fatal | ForEach-Object { "$($_.Status): $($_.StatusInformation.Trim())" }) -join "; "
            throw "Windows code-signing certificate chain validation failed: $chainErrors"
          }
          if (-not $built) {
            Write-Host "::warning::certificate chain is not publicly trusted ($(($chain.ChainStatus | ForEach-Object { $_.Status.ToString() }) -join ', ')). The installer is signed and tamper-evident, but Windows will still warn that the publisher is unknown until an OV/EV certificate replaces this one."
          }
          "WIN_CSC_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Prepare signed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          WIN_CSC_CERTIFICATE_THUMBPRINT: ${{ env.WIN_CSC_CERTIFICATE_THUMBPRINT }}
        run: npm run release:prepare

      - name: Build, sign, and upload installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: v__VERSION__
          releaseName: Redrob Query v__VERSION__
          releaseBody: See CHANGELOG.md for release notes. Installers and updater bundles are signed; the release remains a draft until platform smoke tests are approved.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      # The default bundler ships the build host's libwayland in the AppImage, and on Mesa 25+ that
      # makes WebKitWebProcess abort with EGL_BAD_PARAMETER: the window opens and stays blank
      # (tauri-apps/tauri#15665). Measured on v0.2.0 before this step existed -- strace on the web
      # process, then the same AppImage with only those four libraries removed rendered with no
      # environment overrides. Repacking changes the bytes, so the script also re-signs and patches
      # latest.json; a stale signature still looks signed and breaks every future update.
      - name: Repack the AppImage without bundled Wayland, and re-sign it
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TARGET: ${{ matrix.target }}
          # Pinned by digest: this binary rewrites a signed release artifact.
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" "$APPIMAGETOOL_URL"
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum -c -
          chmod +x "$tool"
          # This is a Cargo workspace rooted at the repo, so the bundle is NOT under src-tauri/;
          # ask cargo, the same way the Windows signature step does.
          target_root="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          # Runners have no FUSE; both the tool and the AppImage run through their own extractor.
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash scripts/resign-linux-appimage.sh \
            "${target_root}/${RELEASE_TARGET}/release/bundle" "${GITHUB_REF_NAME}" "$tool"

      - name: Verify Windows installer signatures and timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          WIN_CSC_CERTIFICATE_THUMBPRINT: ${{ env.WIN_CSC_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          # Ask cargo where its target directory is. This step used to hardcode
          # "src-tauri/target/...", which is where a Tauri app's build output lives when src-tauri
          # holds its own crate -- but this repository's Cargo WORKSPACE root is the repository
          # root, with src-tauri as a member, so the bundles land in <root>/target. The step is
          # Windows-only, so the wrong path was never exercised until the first Windows leg, which
          # failed with "Cannot find path ... src-tauri\target\...\bundle because it does not
          # exist" while the bundles sat in <root>\target\...\bundle\{msi,nsis}.
          #
          # Derived rather than corrected in place: moving src-tauri in or out of the workspace
          # would silently break a second hardcoded path the same way.
          $targetRoot = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          if (-not $targetRoot) { throw "cargo metadata did not report a target_directory" }
          $bundlePath = Join-Path $targetRoot "$env:RELEASE_TARGET/release/bundle"
          if (-not (Test-Path -LiteralPath $bundlePath)) {
            throw "No bundle directory at $bundlePath (cargo target_directory: $targetRoot)"
          }
          $installers = @(Get-ChildItem -LiteralPath $bundlePath -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if (-not ($installers.Extension -contains '.exe') -or -not ($installers.Extension -contains '.msi')) {
            throw "Expected both signed NSIS and MSI installers"
          }
          # A self-signed signer makes Get-AuthenticodeSignature report NotTrusted or
          # UnknownError rather than Valid, on a runner that does not carry our root. Those two
          # are accepted; HashMismatch and NotSigned are not, so an unsigned or modified
          # installer still fails here. The signer thumbprint and the countersignature are
          # asserted unconditionally -- those say it is OUR certificate and that the signing
          # time is attested, neither of which depends on the root being trusted.
          $accepted = @("Valid", "NotTrusted", "UnknownError")
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($accepted -notcontains $signature.Status.ToString()) {
              throw "Installer signature is not usable for $($installer.Name): $($signature.Status) ($($signature.StatusMessage))"
            }
            if (-not $signature.SignerCertificate) {
              throw "Installer carries no Authenticode signer certificate: $($installer.Name)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WIN_CSC_CERTIFICATE_THUMBPRINT) {
              throw "Installer was signed by an unexpected certificate: $($installer.Name)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Installer signature carries no trusted timestamp: $($installer.Name)"
            }
            Write-Host "$($installer.Name) signed by $($signature.SignerCertificate.Subject) status=$($signature.Status)"
          }


  # The CDN promotion job that used to live here is gone: GitHub Releases is now the
  # update channel itself, so there is nothing to copy anywhere. What that job also
  # did, though, was VERIFY the published channel -- so its checks are re-pointed
  # here rather than dropped. Without them the classic failure is silent: the app
  # installs fine and never updates again, because `latest.json` is missing or its
  # platform URLs point somewhere a client cannot reach.
  verify-release-assets:
    name: Updater contract on the draft release
    if: github.event_name == 'push'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # write, not read: this job does not merely inspect the manifest, it corrects the
      # placeholder URLs tauri-action necessarily wrote while the release was a draft.
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tauri-action uploads latest.json while the release is a DRAFT, and a draft asset has
      # no public download URL yet -- GitHub only mints /releases/download/<tag>/<name> at
      # publication -- so the manifest carries REST asset URLs
      # (https://api.github.com/repos/.../releases/assets/<id>) instead. Those would break the
      # updater: that endpoint serves the asset's JSON metadata unless the caller sends
      # `Accept: application/octet-stream`, which a plain updater fetch does not. The published
      # URL is fully determined by the tag and the asset name, so it is written now and is
      # correct the moment the draft is published.
      - name: Point the updater manifest at the published download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # A DRAFT release is NOT on the tags endpoint: GET /releases/tags/<tag> answers 404
          # until publication, because a draft has no published tag to resolve. Since this job
          # exists to inspect the draft, it has to find it in the listing, which does include
          # drafts for a caller with push access.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          release_json="$(jq --arg tag "${RELEASE_TAG}" 'map(select(.tag_name == $tag)) | first // empty' "$RUNNER_TEMP/releases.json")"
          if [ -z "$release_json" ]; then
            echo "::error::No release found for ${RELEASE_TAG}. A draft is only listed to a caller with push access, so check this job's contents permission if the draft does exist."
            exit 1
          fi
          printf '%s' "$release_json" > release.json
          manifest_id="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "latest.json") | .id')"
          if [ -z "$manifest_id" ] || [ "$manifest_id" = "null" ]; then
            echo "::error::latest.json is not attached to ${RELEASE_TAG}; nothing to rewrite"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_id}" > latest.json
          node scripts/rewrite-updater-urls.mjs latest.json release.json \
            "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"
          # Replace in place: an asset name is unique per release, so the old one must go
          # before the corrected manifest can take its name.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_id}"
          gh release upload "${RELEASE_TAG}" latest.json --repo "${GITHUB_REPOSITORY}"

      - name: Assert the draft release carries a usable updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REQUIRED_PLATFORMS: ${{ needs.validate.outputs.platforms }}
          REQUIRED_ASSET_SUFFIXES: ${{ needs.validate.outputs.asset_suffixes }}
        shell: bash
        run: |
          set -euo pipefail

          # The release is still a draft at this point, which is deliberate: draft
          # assets are invisible to `releases/latest/download/...`, so QA happens
          # before any installed client can see the version.
          # A DRAFT release is NOT on the tags endpoint: GET /releases/tags/<tag> answers 404
          # until publication, because a draft has no published tag to resolve. Since this job
          # exists to inspect the draft, it has to find it in the listing, which does include
          # drafts for a caller with push access.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          release_json="$(jq --arg tag "${RELEASE_TAG}" 'map(select(.tag_name == $tag)) | first // empty' "$RUNNER_TEMP/releases.json")"
          if [ -z "$release_json" ]; then
            echo "::error::No release found for ${RELEASE_TAG}. A draft is only listed to a caller with push access, so check this job's contents permission if the draft does exist."
            exit 1
          fi
          draft="$(printf '%s' "$release_json" | jq -r '.draft')"
          if [ "$draft" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} must still be a draft when the build finishes"
            exit 1
          fi

          names="$(printf '%s' "$release_json" | jq -r '.assets[].name')"
          echo "Assets on ${RELEASE_TAG}:"
          printf '  %s\n' $names

          # latest.json IS the feed on GitHub Releases. Missing it does not fail an
          # install, it silently freezes every existing client on its current version.
          if ! printf '%s\n' $names | grep -qx 'latest.json'; then
            echo "::error::latest.json is not attached; published clients would never see this release"
            exit 1
          fi

          # Suffixes come from the same generator that built the matrix, so a bundle type no
          # leg produces is not demanded. Glob matching rather than a regex keeps the list
          # free of escaping, since it crosses a job output boundary.
          for suffix in ${REQUIRED_ASSET_SUFFIXES}; do
            found=0
            for name in $names; do
              case "$name" in
                *"$suffix") found=1; break ;;
              esac
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::no asset ending in ${suffix} -- a built platform produced no installer"
              exit 1
            fi
          done

          manifest_id="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "latest.json") | .id')"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_id}" > latest.json

          version="$(jq -r '.version' latest.json)"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "::error::latest.json version ${version} does not match tag ${RELEASE_TAG}"
            exit 1
          fi

          # Every architecture a build leg produced must be present, and every URL must
          # point at this repository's own release assets. A URL left pointing at a
          # decommissioned host is exactly the shape of failure this job exists to catch.
          #
          # The list comes from the same generator that built the matrix, so a platform that
          # was deliberately not built is not demanded here, and a platform that WAS built
          # cannot be quietly missing from the manifest.
          for platform in ${REQUIRED_PLATFORMS}; do
            url="$(jq -r --arg p "$platform" '.platforms[$p].url // empty' latest.json)"
            sig="$(jq -r --arg p "$platform" '.platforms[$p].signature // empty' latest.json)"
            if [ -z "$url" ] || [ -z "$sig" ]; then
              echo "::error::latest.json is missing a signed entry for ${platform}"
              exit 1
            fi
            case "$url" in
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/"*) ;;
              *)
                echo "::error::${platform} url is not a release asset of this repository: ${url}"
                exit 1
                ;;
            esac
          done

          echo "latest.json covers every built platform (${REQUIRED_PLATFORMS}), is signed, and points only at this repository's release assets."

      # "Has a signature" is not "has the right signature". A signature over different bytes passes
      # the check above and fails on every user's machine at the first update check -- and the
      # AppImage repack step rewrites bytes after tauri-action signed them, so this is a live risk,
      # not a theoretical one. Measured before adding this: the published v0.2.0 signature is VALID
      # for the published AppImage and INVALID for the same file repacked.
      - name: Verify every updater signature against the bytes it covers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          release_json="$(jq --arg tag "${RELEASE_TAG}" 'map(select(.tag_name == $tag)) | first // empty' "$RUNNER_TEMP/releases.json")"
          manifest_id="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "latest.json") | .id')"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_id}" > "$RUNNER_TEMP/latest.json"

          dl="$RUNNER_TEMP/updater-assets"
          mkdir -p "$dl"
          checked=0
          # One line per platform entry: "<key> <asset name> <signature>". Signatures are base64,
          # so they never contain a space.
          while read -r platform asset signature; do
            asset_id="$(printf '%s' "$release_json" | jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .id')"
            if [ -z "$asset_id" ]; then
              echo "::error::${platform} names ${asset}, which is not attached to ${RELEASE_TAG}"
              exit 1
            fi
            [ -f "$dl/$asset" ] || gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$dl/$asset"
            if ! result="$(node scripts/verify-updater-signature.mjs "$TAURI_UPDATER_PUBLIC_KEY" "$signature" "$dl/$asset")"; then
              echo "::error::${platform}: ${result} (${asset})"
              exit 1
            fi
            echo "${platform}: ${result} (${asset})"
            checked=$((checked + 1))
          done < <(jq -r '.platforms | to_entries[] | "\(.key) \(.value.url | split("/") | last) \(.value.signature)"' "$RUNNER_TEMP/latest.json")

          if [ "$checked" -eq 0 ]; then
            echo "::error::latest.json has no platform entries; nothing was verified"
            exit 1
          fi
          echo "Every one of ${checked} updater signatures verifies against the bytes it names."
