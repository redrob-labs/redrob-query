# The one pull-request workflow. `checks` runs the repository scripts: the brand-asset pins. `rust`
# runs formatting, clippy and the tests of OUR crates (the shell `redrob-query` and the engine
# `redrob-query-core`) with `--profile ci` (root Cargo.toml: every dependency at opt-level 0, no
# incremental), and is skipped when no Rust input changed or when the pull request targets main (that
# code already passed here on its way into develop). The release workflow does not repeat any of this;
# PR policy is the org-wide workflow. Adapted from redrob-canvas.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  OUR_CRATES: -p redrob-query -p redrob-query-core

jobs:
  checks:
    name: brand assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - name: Brand assets match the design system pins
        run: python3 scripts/check-brand.py

  rust:
    name: fmt, clippy, test (profile ci)
    # A release PR into main carries code that already passed here on its way into develop.
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - name: Did any Rust input change?
        id: rs
        run: |
          git fetch -q origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- '*.rs' '*.toml' Cargo.lock '*.json' .github/workflows/ci.yml; then
            echo changed=false >> "$GITHUB_OUTPUT"; else echo changed=true >> "$GITHUB_OUTPUT"; fi
      - name: System libraries for the desktop app
        if: steps.rs.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: steps.rs.outputs.changed == 'true'
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.rs.outputs.changed == 'true'
        with:
          key: ci-profile
      - name: Formatting
        if: steps.rs.outputs.changed == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.rs.outputs.changed == 'true'
        run: |
          # shellcheck disable=SC2086 # OUR_CRATES is a list of flags on purpose
          cargo clippy $OUR_CRATES --all-targets --locked --profile ci -- -D warnings
      - name: Tests
        if: steps.rs.outputs.changed == 'true'
        run: |
          # shellcheck disable=SC2086
          cargo test $OUR_CRATES --locked --profile ci
